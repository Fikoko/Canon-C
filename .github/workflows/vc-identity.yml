name: VC identity (paper experiment)

# ---------------------------------------------------------------------------
# Phased harness for the FM 2027 paper's VC-identity measurement.
# MANUAL TRIGGER ONLY — does not run on push and gates nothing.
#
# QUESTION: when arena.h's proof obligations are re-derived inside vec's
# mega-TU, does WP hand the solvers the SAME generated task, or a different
# one? The answer decides whether the paper's composition result is a finding
# or a corollary of WP's determinism.
#
# ---------------------------------------------------------------------------
# MEASURED SO FAR — read before trusting any of it
#
#   Run #1 (31236445928, 2026-08-08), phases 3 and 5, Frama-C 29.0 (Copper):
#     arena.h, full provers, -wp-cache update : 3430 / 3521, 740 cache entries
#     vec's TU, -wp-cache offline vs that cache: 4882 / 5429, provers disabled
#     phase 5 (-wp-gen dump)                  : 0 files — WRONG PROVER SYNTAX.
#       WP wants -wp-prover why3:alt-ergo, not -wp-prover why3. Fixed in
#       phase 6 below.
#
#   Run #2, phase 2, Qed-only baselines (empty cache, provers disabled):
#     vec's TU   : 4644 / 5429
#     arena's TU : 3065 / 3521
#
#   DERIVED, AND NOT IDENTIFIABLE — do not put this in the paper:
#     3430 - 3065 = 365 arena goals needed a prover and proved. This one IS
#     sound: it reproduces exactly from the per-prover attribution recorded in
#     docs/deviations.md VERIFY-009-W (#1202: Alt-Ergo 325 + CVC5 11 + Z3 29),
#     and all three runs there sum to 365 while the internal split swings.
#
#     4882 - 4644 = 238 is NOT "substrate tasks reused from arena", and
#     365 - 238 = 127 is NOT "tasks rebuilt differently". Two confounds:
#
#       (i) QED PRECEDENCE. 365 is over arena's 3,521-goal population, 238
#           over vec's 5,429. Their difference measures task divergence only
#           if arena's Qed-discharged set is identical inside vec — the very
#           context-invariance in question. An arena Qed rate of 90.7% inside
#           vec (vs 87.05% standalone) absorbs all 127 with ZERO divergence.
#
#      (ii) CONTENT-ADDRESSED COLLISIONS. WP's cache keys on generated task
#           text, not goal name. Run #1's log shows result__Bool_Error goals
#           marked (Cached) although arena.h's include closure provably
#           contains no result.h — so unrelated goals with identical task
#           text share entries, and 238 overcounts substrate reuse.
#
#     Also: for the ~40 goals arena closed on CVC5/Z3, Alt-Ergo's cached
#     non-Valid sits first in the prover list on replay, which can present as
#     a miss at zero divergence. And n=1 against a process whose prover
#     attribution demonstrably moves run to run.
#
#   PHASE 6 IS THE ANSWER. It dumps the generated tasks and hashes them
#   directly — immune to Qed precedence and to cache collisions, and it
#   invokes no prover, so it is CHEAPER than the runs above.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      phase6_task_hash:
        description: "Phase 6 — dump generated tasks and hash them. THE measurement. No provers, ~15 min."
        type: boolean
        default: true
      phase2_qed_baseline:
        description: "Phase 2 — Qed-only baselines (~20 min). Done; not identifiable on its own."
        type: boolean
        default: false
      phase3_cache_replay:
        description: "Phase 3 — cache populate + offline replay (~1.5h). Done; confounded."
        type: boolean
        default: false
      phase4_hash_intersection:
        description: "Phase 4 — full proving + cache-hash intersection (~4h). Superseded by phase 6."
        type: boolean
        default: false

env:
  ARENA_INC: "-I core/primitives -I core -I ."
  VEC_INC: "-I core/primitives -I core -I semantics -I data -I ."
  MODEL: "-wp-rte -wp-model Typed+Cast -wp-split"

jobs:
  vc-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      - name: "Phase 1 — toolchain and prover spellings"
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          frama-c -version
          echo "=== provers WP can actually name (-wp-detect) ==="
          frama-c -wp -wp-detect 2>&1 | head -40
          exit 0

      # ---------------------------------------------------------- phase 6
      # The direct instrument. -wp-gen generates prover files and never calls
      # a prover, so Qed precedence and cache behaviour are both bypassed.
      - name: "Phase 6 — generated-task hashes (the measurement)"
        if: ${{ inputs.phase6_task_hash }}
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          OUT=$GITHUB_WORKSPACE/vc-out; mkdir -p "$OUT"

          gen () {  # gen <label> <outdir> <includes> <target>
            local label="$1" dir="$2" inc="$3" tgt="$4"
            for P in "why3:alt-ergo" "alt-ergo" "why3:z3" "native:alt-ergo"; do
              rm -rf "$dir"; mkdir -p "$dir"
              frama-c -wp ${MODEL} -wp-gen -wp-prover "$P" -wp-out "$dir" \
                -cpp-extra-args=" $inc -DCANON_NO_REQUIRE -DNDEBUG" \
                "$tgt" > "$OUT/$label.gen.log" 2>&1
              local n=$(find "$dir" -type f 2>/dev/null | wc -l)
              echo "  $label via -wp-prover '$P': $n files"
              if [ "$n" -gt 0 ]; then echo "$P" > "$OUT/$label.prover"; return 0; fi
            done
            echo "  $label: NO FILES under any prover spelling — see $label.gen.log"
            tail -20 "$OUT/$label.gen.log"
            return 1
          }

          echo "=== generating arena.h's tasks (no provers) ==="
          gen arena "$OUT/arena" "${ARENA_INC}" core/arena.h
          echo "=== generating vec's tasks (no provers) ==="
          gen vec   "$OUT/vec"   "${VEC_INC}"   vmacros/vdrivers/vec_verify.h

          echo ""
          echo "=== layout ==="
          find "$OUT/arena" -type f | sed "s|$OUT/arena/||" | sort | head -20
          echo "  arena files: $(find "$OUT/arena" -type f | wc -l)"
          find "$OUT/vec" -type f | sed "s|$OUT/vec/||" | sort | head -20
          echo "  vec files  : $(find "$OUT/vec" -type f | wc -l)"

          # Hash every generated file, keyed by its path relative to the
          # output root. The relative path encodes the goal, so this gives
          # BOTH a name-level and a content-level comparison.
          ( cd "$OUT/arena" && find . -type f -exec sha256sum {} \; ) \
            | sed 's|  \./|  |' | sort -k2 > "$OUT/arena.sha"
          ( cd "$OUT/vec" && find . -type f -exec sha256sum {} \; ) \
            | sed 's|  \./|  |' | sort -k2 > "$OUT/vec.sha"

          awk '{print $2}' "$OUT/arena.sha" | sort > "$OUT/arena.names"
          awk '{print $2}' "$OUT/vec.sha"   | sort > "$OUT/vec.names"
          comm -12 "$OUT/arena.names" "$OUT/vec.names" > "$OUT/shared.names"
          comm -23 "$OUT/arena.names" "$OUT/vec.names" > "$OUT/arena-only.names"

          SAME=0; DIFF=0
          : > "$OUT/changed.names"
          while IFS= read -r n; do
            a=$(grep -F " $n" "$OUT/arena.sha" | awk '{print $1}' | head -1)
            b=$(grep -F " $n" "$OUT/vec.sha"   | awk '{print $1}' | head -1)
            if [ "$a" = "$b" ]; then SAME=$((SAME+1))
            else DIFF=$((DIFF+1)); echo "$n" >> "$OUT/changed.names"; fi
          done < "$OUT/shared.names"

          echo ""
          echo "==================== THE MEASUREMENT ===================="
          echo "  arena task files                 : $(wc -l < "$OUT/arena.names")"
          echo "  vec task files                   : $(wc -l < "$OUT/vec.names")"
          echo "  present in BOTH by goal path     : $(wc -l < "$OUT/shared.names")"
          echo "  of those, BYTE-IDENTICAL         : $SAME"
          echo "  of those, CONTENT CHANGED        : $DIFF"
          echo "  in arena, ABSENT from vec        : $(wc -l < "$OUT/arena-only.names")"
          echo ""
          echo "  This is immune to Qed precedence and to cache collisions:"
          echo "  no prover is invoked and no cache is consulted. If CONTENT"
          echo "  CHANGED is materially non-zero, the composition result is"
          echo "  NOT a determinism corollary — WP builds a different query"
          echo "  for the same named obligation and the verdict holds anyway."
          echo ""
          echo "  first 30 changed goals:"
          head -30 "$OUT/changed.names"
          echo "========================================================"
          exit 0

      # ---------------------------------------------------------- phase 2
      - name: "Phase 2 — Qed-only baselines"
        if: ${{ inputs.phase2_qed_baseline }}
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          OUT=$GITHUB_WORKSPACE/vc-out; mkdir -p "$OUT"
          EMPTY=$GITHUB_WORKSPACE/empty-cache; mkdir -p "$EMPTY"
          for pair in "vec:${VEC_INC}:vmacros/vdrivers/vec_verify.h" \
                      "arena:${ARENA_INC}:core/arena.h"; do
            L=${pair%%:*}; rest=${pair#*:}; INC=${rest%%:*}; TGT=${rest#*:}
            frama-c -wp ${MODEL} -wp-cache offline -wp-cache-dir "$EMPTY" \
              -cpp-extra-args=" $INC -DCANON_NO_REQUIRE -DNDEBUG" \
              "$TGT" > "$OUT/$L-qed-only.log" 2>&1
            echo "  $L Qed-only: $(grep -E '^\[wp\] Proved goals:' "$OUT/$L-qed-only.log")"
          done
          echo "  NOTE: these scalars alone cannot separate task divergence"
          echo "  from Qed absorption. Phase 6 is the identifiable measurement."
          exit 0

      # ---------------------------------------------------------- phase 3
      - name: "Phase 3 — cache populate + offline replay"
        if: ${{ inputs.phase3_cache_replay }}
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          OUT=$GITHUB_WORKSPACE/vc-out; CACHE=$GITHUB_WORKSPACE/wpcache
          mkdir -p "$OUT" "$CACHE"
          frama-c -wp ${MODEL} -wp-prover alt-ergo,z3,cvc5 -wp-timeout 120 \
            -wp-cache update -wp-cache-dir "$CACHE" \
            -cpp-extra-args=" ${ARENA_INC} -DCANON_NO_REQUIRE -DNDEBUG" \
            core/arena.h > "$OUT/arena-cache-update.log" 2>&1
          echo "  arena: $(grep -E '^\[wp\] Proved goals:' "$OUT/arena-cache-update.log")"
          echo "  cache entries: $(find "$CACHE" -type f | wc -l)"
          frama-c -wp ${MODEL} -wp-cache offline -wp-cache-dir "$CACHE" \
            -cpp-extra-args=" ${VEC_INC} -DCANON_NO_REQUIRE -DNDEBUG" \
            vmacros/vdrivers/vec_verify.h > "$OUT/vec-cache-offline.log" 2>&1
          echo "  vec offline: $(grep -E '^\[wp\] Proved goals:' "$OUT/vec-cache-offline.log")"
          echo "  (Cached) markers total : $(grep -c '(Cached)' "$OUT/vec-cache-offline.log")"
          echo "  of which on NON-arena goals (collision evidence):"
          grep '(Cached)' "$OUT/vec-cache-offline.log" \
            | grep -cE 'result_|option_|vec_int_'
          exit 0

      # ---------------------------------------------------------- phase 4
      - name: "Phase 4 — cache-hash intersection (superseded by phase 6)"
        if: ${{ inputs.phase4_hash_intersection }}
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          OUT=$GITHUB_WORKSPACE/vc-out
          A=$GITHUB_WORKSPACE/cache-arena; V=$GITHUB_WORKSPACE/cache-vec
          mkdir -p "$A" "$V" "$OUT"
          frama-c -wp ${MODEL} -wp-prover alt-ergo,z3,cvc5 -wp-timeout 120 \
            -wp-cache update -wp-cache-dir "$A" \
            -cpp-extra-args=" ${ARENA_INC} -DCANON_NO_REQUIRE -DNDEBUG" \
            core/arena.h > "$OUT/A.log" 2>&1
          frama-c -wp ${MODEL} -wp-prover alt-ergo,z3,cvc5 -wp-timeout 120 \
            -wp-cache update -wp-cache-dir "$V" \
            -cpp-extra-args=" ${VEC_INC} -DCANON_NO_REQUIRE -DNDEBUG" \
            vmacros/vdrivers/vec_verify.h > "$OUT/V.log" 2>&1
          find "$A" -type f -printf '%f\n' | sort -u > "$OUT/A.hashes"
          find "$V" -type f -printf '%f\n' | sort -u > "$OUT/V.hashes"
          echo "  arena hashes: $(wc -l < "$OUT/A.hashes")"
          echo "  vec hashes  : $(wc -l < "$OUT/V.hashes")"
          echo "  shared      : $(comm -12 "$OUT/A.hashes" "$OUT/V.hashes" | wc -l)"
          echo "  arena-only  : $(comm -23 "$OUT/A.hashes" "$OUT/V.hashes" | wc -l)"
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vc-identity-${{ github.run_number }}
          path: vc-out/**
          retention-days: 90
