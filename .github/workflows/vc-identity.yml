name: VC identity (paper experiment)

# ---------------------------------------------------------------------------
# MANUAL TRIGGER ONLY. Does WP hand the solvers the SAME generated task for a
# substrate goal inside a larger composing unit?
#
# RUN LOG
#   #1 phase 3 : arena 3430/3521 full provers, 740 cache entries;
#                vec offline vs that cache 4882/5429
#   #2 phase 2 : vec Qed-only 4644/5429 ; arena Qed-only 3065/3521
#   #3 phase 6 : -wp-gen produced nothing — cause found in #4
#   #4 phase 7 : cause was a bad prover name, "Prover 'why3:alt-ergo' not
#                found in why3.conf". Correct spelling is plain `alt-ergo`
#                (why3.conf registers it as Alt-Ergo:2.6.3). Also confirmed
#                -wp-report-json works and emits, PER GOAL: goal name, source
#                file, function, verdict, and the prover that discharged it
#                (including "qed"). Its floats are written "0." which stock
#                json.load rejects — repaired below.
#
# SOUND SO FAR: arena has exactly 365 goals that needed a prover and proved
#   (3430 - 3065), corroborated by VERIFY-009-W's per-prover attribution at
#   #1202 (325 + 11 + 29). WP's cache is CONTENT-addressed, not name-keyed.
#
# NOT IDENTIFIABLE, never published: 4882 - 4644 = 238 and 365 - 238 = 127.
#   Those subtract across two different goal populations and assume Qed's
#   reach is context-invariant, which is the very question. Phase 9 replaces
#   them with a per-goal, name-level three-way split.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      phase10_taskhash:
        description: "Phase 10 — -wp-gen task hashes with the CORRECT prover name (~15 min)"
        type: boolean
        default: true
      phase9_json:
        description: "Phase 9 — per-goal three-way split via JSON, identifiable (~1h15)"
        type: boolean
        default: true

env:
  ARENA_INC: "-I core/primitives -I core -I ."
  VEC_INC: "-I core/primitives -I core -I semantics -I data -I ."
  MODEL: "-wp-rte -wp-model Typed+Cast -wp-split"

jobs:
  vc-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/framac-setup

      # --------------------------------------------------------- phase 10
      - name: "Phase 10 — generated-task hashes (direct, no provers)"
        if: ${{ inputs.phase10_taskhash }}
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          OUT=$GITHUB_WORKSPACE/vc-out; mkdir -p "$OUT"

          echo "=== arena.h, -wp-gen -wp-prover alt-ergo ==="
          frama-c -wp ${MODEL} -wp-gen -wp-prover alt-ergo -wp-out "$OUT/arena" \
            "-cpp-extra-args= ${ARENA_INC} -DCANON_NO_REQUIRE -DNDEBUG" \
            core/arena.h > "$OUT/gen-arena.log" 2>&1
          echo "exit=$?  files=$(find "$OUT/arena" -type f 2>/dev/null | wc -l)"
          grep -E "User Error|aborted" "$OUT/gen-arena.log" | head -5

          echo "=== vec_verify.h, -wp-gen -wp-prover alt-ergo ==="
          frama-c -wp ${MODEL} -wp-gen -wp-prover alt-ergo -wp-out "$OUT/vec" \
            "-cpp-extra-args= ${VEC_INC} -DCANON_NO_REQUIRE -DNDEBUG" \
            vmacros/vdrivers/vec_verify.h > "$OUT/gen-vec.log" 2>&1
          echo "exit=$?  files=$(find "$OUT/vec" -type f 2>/dev/null | wc -l)"
          grep -E "User Error|aborted" "$OUT/gen-vec.log" | head -5

          A=$(find "$OUT/arena" -type f 2>/dev/null | wc -l)
          V=$(find "$OUT/vec" -type f 2>/dev/null | wc -l)
          if [ "$A" -eq 0 ] || [ "$V" -eq 0 ]; then
            echo "no task files — phase 9 carries the measurement"; exit 0
          fi

          echo ""
          echo "=== layout ==="
          find "$OUT/arena" -type f | sed "s|$OUT/arena/||" | sort | head -20

          ( cd "$OUT/arena" && find . -type f -exec sha256sum {} \; ) | sed 's|\./||' | sort -k2 > "$OUT/arena.sha"
          ( cd "$OUT/vec"   && find . -type f -exec sha256sum {} \; ) | sed 's|\./||' | sort -k2 > "$OUT/vec.sha"
          awk '{print $2}' "$OUT/arena.sha" | sort > "$OUT/arena.names"
          awk '{print $2}' "$OUT/vec.sha"   | sort > "$OUT/vec.names"
          comm -12 "$OUT/arena.names" "$OUT/vec.names" > "$OUT/shared.names"

          SAME=0; DIFF=0; : > "$OUT/changed.names"
          while IFS= read -r n; do
            a=$(awk -v k="$n" '$2==k{print $1; exit}' "$OUT/arena.sha")
            b=$(awk -v k="$n" '$2==k{print $1; exit}' "$OUT/vec.sha")
            if [ "$a" = "$b" ]; then SAME=$((SAME+1)); else DIFF=$((DIFF+1)); echo "$n" >> "$OUT/changed.names"; fi
          done < "$OUT/shared.names"

          echo ""
          echo "============= PHASE 10: DIRECT TASK IDENTITY ============="
          echo "  arena task files            : $A"
          echo "  vec task files              : $V"
          echo "  shared by goal path         : $(wc -l < "$OUT/shared.names")"
          echo "  BYTE-IDENTICAL              : $SAME"
          echo "  CONTENT CHANGED             : $DIFF"
          echo "  first 30 changed:"; head -30 "$OUT/changed.names"
          echo "========================================================="
          exit 0

      # ---------------------------------------------------------- phase 9
      - name: "Phase 9 — per-goal three-way split (JSON)"
        if: ${{ inputs.phase9_json }}
        run: |
          eval $(opam env --switch=frama-c)
          set +e
          OUT=$GITHUB_WORKSPACE/vc-out; mkdir -p "$OUT"
          CACHE=$GITHUB_WORKSPACE/wpcache; mkdir -p "$CACHE"

          echo "=== 9.1 arena.h, full provers, populate cache, JSON (~1h) ==="
          frama-c -wp ${MODEL} -wp-prover alt-ergo,z3,cvc5 -wp-timeout 120 \
            -wp-cache update -wp-cache-dir "$CACHE" \
            -wp-report-json "$OUT/arena-full.json" \
            "-cpp-extra-args= ${ARENA_INC} -DCANON_NO_REQUIRE -DNDEBUG" \
            core/arena.h > "$OUT/9.1.log" 2>&1
          echo "  $(grep -E '^\[wp\] Proved goals:' "$OUT/9.1.log")"
          echo "  cache entries: $(find "$CACHE" -type f | wc -l)"

          echo "=== 9.2 vec's TU, offline vs that cache, JSON (~15 min) ==="
          frama-c -wp ${MODEL} -wp-cache offline -wp-cache-dir "$CACHE" \
            -wp-report-json "$OUT/vec-offline.json" \
            "-cpp-extra-args= ${VEC_INC} -DCANON_NO_REQUIRE -DNDEBUG" \
            vmacros/vdrivers/vec_verify.h > "$OUT/9.2.log" 2>&1
          echo "  $(grep -E '^\[wp\] Proved goals:' "$OUT/9.2.log")"

          echo ""
          echo "=== 9.3 per-goal three-way split ==="
          python3 - <<'PY'
          import json, os, re, collections
          OUT = os.environ['GITHUB_WORKSPACE'] + '/vc-out'

          def load(p):
              t = open(p).read()
              t = re.sub(r'(\d)\.(?=\s*[,}\]])', r'\1.0', t)   # "0." -> "0.0"
              return json.loads(t)

          def index(doc):
              d = {}
              for g in doc:
                  if not isinstance(g, dict) or 'goal' not in g: continue
                  provers = [str(p.get('prover','')).lower()
                             for p in (g.get('provers') or [])
                             if p.get('success')]
                  d[g['goal']] = {
                      'file': os.path.basename(str(g.get('file',''))),
                      'fn': g.get('function',''),
                      'verdict': str(g.get('verdict','')).lower(),
                      'by': provers }
              return d

          A = index(load(f"{OUT}/arena-full.json"))
          V = index(load(f"{OUT}/vec-offline.json"))
          print(f"  arena goals in JSON: {len(A)}   vec goals in JSON: {len(V)}")

          # arena's own goals, by SOURCE FILE — exact, not a name heuristic
          arena_goals = {k: v for k, v in A.items() if v['file'] == 'arena.h'}
          print(f"  goals attributed to arena.h: {len(arena_goals)}")

          qed_only   = {k for k, v in arena_goals.items()
                        if v['verdict'] == 'valid' and v['by'] == ['qed']}
          prover_won = {k for k, v in arena_goals.items()
                        if v['verdict'] == 'valid' and any(p != 'qed' for p in v['by'])}
          residual   = {k for k, v in arena_goals.items() if v['verdict'] != 'valid'}
          print(f"  arena.h: Qed-only {len(qed_only)}, prover-discharged "
                f"{len(prover_won)}, residual {len(residual)}")

          absorbed = identical = diverged = absent = 0
          div_names, abs_names = [], []
          for g in sorted(prover_won):
              v = V.get(g)
              if v is None:
                  absent += 1; continue
              if v['verdict'] != 'valid':
                  diverged += 1; div_names.append(g)
              elif v['by'] == ['qed']:
                  absorbed += 1; abs_names.append(g)
              else:
                  identical += 1

          n = len(prover_won)
          print()
          print("  ============ IDENTIFIABLE THREE-WAY SPLIT ============")
          print(f"  arena goals needing a prover in arena's own TU : {n}")
          print(f"    -> in vec, discharged by a NAMED prover")
          print(f"       (provers disabled => cache hit => SAME TASK): {identical}")
          print(f"    -> in vec, discharged by QED")
          print(f"       (context strengthened Qed — a context effect): {absorbed}")
          print(f"    -> in vec, NOT proved (task diverged)           : {diverged}")
          print(f"    -> not present in vec's JSON at all             : {absent}")
          print()
          print("  Non-zero 'task diverged' => the composition result is NOT a")
          print("  determinism corollary. Zero diverged AND zero absorbed =>")
          print("  it is, and the paper leads with the perturbations that DO")
          print("  change the task (width, source churn, closure, addition).")
          print("  ======================================================")
          print()
          print("  first 25 DIVERGED:"); [print("   ", x) for x in div_names[:25]]
          print("  first 10 QED-ABSORBED:"); [print("   ", x) for x in abs_names[:10]]

          by_fn = collections.Counter(A[g]['fn'] for g in div_names)
          print("\n  diverged goals by function (top 15):")
          for f, c in by_fn.most_common(15): print(f"    {c:4d}  {f}")
          PY
          exit 0

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: vc-identity-${{ github.run_number }}
          path: vc-out/**
          retention-days: 90
